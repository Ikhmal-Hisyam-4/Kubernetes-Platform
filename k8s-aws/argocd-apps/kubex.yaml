# Argo CD Application for the kubex app (namespace: kubex).
# Auto-sync: a merged change in git is deployed by Argo CD by itself.
# selfHeal: manual edits on the cluster are reverted to what git says.
# prune stays off: Argo CD never deletes objects that are missing from git.
# No resources-finalizer on purpose: deleting this Application leaves the app running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubex
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ikhmal-Hisyam-4/Kubernetes-Platform.git
    targetRevision: main
    path: k8s-aws
  destination:
    server: https://kubernetes.default.svc
    namespace: kubex
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
