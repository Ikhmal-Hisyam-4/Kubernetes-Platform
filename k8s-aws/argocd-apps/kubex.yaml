# Argo CD Application for the kubex app (namespace: kubex).
# Manual sync for now: Argo CD only shows what differs, it changes nothing.
# No resources-finalizer on purpose: deleting this Application leaves the app running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubex
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ikhmal-Hisyam-4/Kubernetes-Platform.git
    targetRevision: main
    path: k8s-aws
  destination:
    server: https://kubernetes.default.svc
    namespace: kubex
