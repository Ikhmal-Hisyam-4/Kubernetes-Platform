apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U kubex -d kubex_db; do echo waiting for postgres; sleep 3; done
      containers:
        - name: backend
          image: ikhmalhisyam4/kubex-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubex-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubex-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              value: postgresql://kubex:$(POSTGRES_PASSWORD)@postgres:5432/kubex_db
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: kubex-config
                  key: REDIS_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: kubex-config
                  key: FRONTEND_URL
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubex
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
