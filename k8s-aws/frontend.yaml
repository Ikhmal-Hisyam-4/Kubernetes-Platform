# Uses the public kubex-web:latest image, same one deployed to real production.
# Its API calls are baked in at build time to point at https://api.kubex.my —
# this frontend talks to the REAL production backend/database, not the
# backend/postgres deployed elsewhere in this k8s-aws-k3s/ folder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kubex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ikhmalhisyam4/kubex-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kubex
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
