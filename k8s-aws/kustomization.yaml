# Used by Argo CD (it renders this folder with kustomize).
# - images: the deployed version lives here, in git. CI bumps newTag.
# - patches: Argo CD sync order. Lower wave runs first and must be healthy
#   before the next one starts: db/redis -> migrate job -> backend/frontend.
# The manifests themselves are untouched (still ":latest"), so the old
# `kubectl apply` pipeline keeps working if we ever go back to it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-seed-job.yaml
  - backend.yaml
  - frontend.yaml
  - ingress-backend.yaml
  - ingress-frontend.yaml
# kubex-secret is NOT in git. It is created once by hand/CI and must already exist.

images:
  - name: ikhmalhisyam4/kubex-api
    newTag: prod-a94d56fe896b21450d32b9b16d94dea20e44faf7
  - name: ikhmalhisyam4/kubex-web
    newTag: prod-a94d56fe896b21450d32b9b16d94dea20e44faf7

patches:
  # wave -2: namespace, -1: config
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubex-config
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
  # wave 0 (default): postgres + redis

  # wave 1: migrate/seed job. Hook = deleted and re-created on every sync.
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: migrate-seed
        namespace: kubex
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          argocd.argoproj.io/sync-wave: "1"

  # wave 2: the app itself
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: frontend
        namespace: kubex
        annotations:
          argocd.argoproj.io/sync-wave: "2"
