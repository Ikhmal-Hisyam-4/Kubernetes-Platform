# One tiny pod per node (including the server) exposing CPU/RAM/disk/network on :9100.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --path.rootfs=/host
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.loadavg
            - --collector.filesystem
            - --collector.diskstats
            - --collector.netdev
            - --collector.uname
            - --collector.time
            - --collector.filefd
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/(kubelet|containerd|rancher).*)($|/)
          ports:
            - containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              cpu: 10m
              memory: 15Mi
            limits:
              memory: 50Mi
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: rootfs
          hostPath:
            path: /
