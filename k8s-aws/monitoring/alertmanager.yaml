# Sends alert emails through Brevo SMTP.
# The SMTP key is NOT in git. Create it once on the server:
#   kubectl -n monitoring create secret generic alertmanager-smtp --from-file=smtp-key=<file with the key>
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: smtp-relay.brevo.com:587
      smtp_from: alerts@kubex.my
      smtp_auth_username: c0a374001@smtp-brevo.com
      smtp_auth_password_file: /etc/alertmanager/secret/smtp-key
      smtp_require_tls: true
    route:
      receiver: email
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: email
        email_configs:
          - to: ikhmalhisyam4@gmail.com
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # keep monitoring off the control-plane node (it has the least free RAM)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # links in alert emails; opens when you tunnel/port-forward to :9093
            - --web.external-url=http://localhost:9093
          ports:
            - containerPort: 9093
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 100Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: smtp
              mountPath: /etc/alertmanager/secret
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: smtp
          secret:
            secretName: alertmanager-smtp
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
