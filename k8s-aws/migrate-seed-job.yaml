apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-seed
  namespace: kubex
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U kubex -d kubex_db; do echo waiting for postgres; sleep 3; done
      containers:
        - name: migrate-seed
          image: ikhmalhisyam4/kubex-api:latest
          command:
            - sh
            - -c
            - alembic upgrade head && python -m app.seed
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubex-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://kubex:$(POSTGRES_PASSWORD)@postgres:5432/kubex_db
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: kubex-config
                  key: REDIS_URL
