apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-seed
  namespace: kubex
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -d "$DATABASE_URL"; do echo waiting for postgres; sleep 3; done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db
                  key: DATABASE_URL
      containers:
        - name: migrate-seed
          image: ikhmalhisyam4/kubex-api:latest
          command:
            - sh
            - -c
            - alembic upgrade head && python -m app.seed
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: kubex-config
                  key: REDIS_URL
