# Limited kubectl account for the self-hosted GitHub runner on agent-1.
# Applied ONCE by hand on the server (NOT by the pipeline), so the pipeline
# can never change its own permissions. Works only inside the kubex namespace
# and has no access to Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: kubex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: kubex
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: kubex
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: kubex
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived token for the ServiceAccount above.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: kubex
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
