# Light Argo CD for the 2 GB k3s nodes.
# Upstream install.yaml (pinned) + our changes below. Apply with:
#   sudo kubectl apply -k ~/argocd --server-side --force-conflicts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
  - ingress.yaml

patches:
  # Not needed here: no SSO (Dex), no notifications, no ApplicationSets.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller

  # TLS ends at Cloudflare/Traefik, so the server speaks plain HTTP inside the cluster.
  # Fewer parallel workers = less memory.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        controller.status.processors: "10"
        controller.operation.processors: "5"

  # Memory limits + keep everything off the control-plane node (least free RAM).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            containers:
              - name: argocd-server
                resources:
                  requests: {cpu: 20m, memory: 80Mi}
                  limits: {memory: 200Mi}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {cpu: 20m, memory: 100Mi}
                  limits: {memory: 300Mi}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            containers:
              - name: redis
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {memory: 100Mi}
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            containers:
              - name: argocd-application-controller
                resources:
                  requests: {cpu: 50m, memory: 150Mi}
                  limits: {memory: 400Mi}
