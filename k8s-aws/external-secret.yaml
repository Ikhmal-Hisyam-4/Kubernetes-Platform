apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubex-secret
  namespace: kubex
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: kubex-secret
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: kubex/app-secret
        property: POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: kubex/app-secret
        property: JWT_SECRET
