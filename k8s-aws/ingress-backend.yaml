apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: kubex
spec:
  ingressClassName: traefik
  rules:
    - host: api.kubex.my
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
