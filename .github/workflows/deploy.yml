name: Deploy

on:
  push:
    branches: [main]
    # Docs and diagrams only: nothing to build or deploy.
    # (A push that also changes code still runs.)
    paths-ignore:
      - '**.md'
      - 'aws-kubernetes-platform/**'
      - 'architecture-diagram/**'
      - 'cicd-diagrams/**'
  # Lets you run the deploy by hand from the Actions tab (any branch).
  workflow_dispatch:

# Never let two deploys race each other; queue instead of cancelling a live one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same checks as ci.yml. If any fail, nothing is built, pushed or deployed.
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-api:prod-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-web:prod-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: build-and-push
    # Self-hosted runner on k3s agent-1 (label kubex-deploy). It talks to the
    # cluster with the limited `deployer` account (k8s-aws/deployer-rbac.yaml),
    # so no SSH, no open port 22 and no AWS keys are needed.
    runs-on: [self-hosted, kubex-deploy]
    # Add a required reviewer on this environment in repo settings
    # (Settings > Environments > production) to get the manual approval gate.
    environment: production
    env:
      IMAGE_TAG: prod-${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      # Everything below is idempotent (kubectl apply).
      # supabase-db, backup-aws and alertmanager-smtp are NOT in git.
      # They already exist in the cluster and are never touched here.
      # kubex-secret is managed by the External Secrets Operator (see
      # secret-store.yaml / external-secret.yaml) — synced from AWS Secrets
      # Manager, not applied by hand.
      # namespace.yaml is not applied: the namespace already exists and the
      # deployer account is limited to it.
      - name: Apply config, postgres, redis, backup
        working-directory: k8s-aws
        run: |
          kubectl apply -f secret-store.yaml
          kubectl apply -f external-secret.yaml
          kubectl apply -f configmap.yaml
          kubectl apply -f postgres.yaml
          kubectl apply -f redis.yaml
          kubectl apply -f postgres-backup.yaml
          kubectl rollout status deployment/postgres -n kubex --timeout=180s
          kubectl rollout status deployment/redis -n kubex --timeout=120s

      # Migrations run before the new code starts serving traffic.
      # Jobs are immutable, so delete + recreate with this run's image tag.
      - name: Run migrate + seed job
        working-directory: k8s-aws
        run: |
          kubectl delete job migrate-seed -n kubex --ignore-not-found
          sed "s|kubex-api:latest|kubex-api:${IMAGE_TAG}|" migrate-seed-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/migrate-seed -n kubex --timeout=180s \
            || { kubectl logs -n kubex job/migrate-seed --tail=50; exit 1; }

      - name: Deploy backend + frontend
        working-directory: k8s-aws
        run: |
          sed "s|kubex-api:latest|kubex-api:${IMAGE_TAG}|" backend.yaml | kubectl apply -f -
          sed "s|kubex-web:latest|kubex-web:${IMAGE_TAG}|" frontend.yaml | kubectl apply -f -
          kubectl apply -f ingress-frontend.yaml
          kubectl apply -f ingress-backend.yaml
          kubectl rollout status deployment/backend -n kubex --timeout=180s
          kubectl rollout status deployment/frontend -n kubex --timeout=180s

      - name: Show cluster state
        if: always()
        run: kubectl get pods,svc,ingress -n kubex || true
