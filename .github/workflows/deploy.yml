name: Deploy

on:
  push:
    branches: [main]
    # The tag-bump PR only touches this file. Merging it must not start another
    # build, or we would loop: merge -> build -> new bump PR -> merge ...
    paths-ignore:
      - k8s-aws/kustomization.yaml
  # Lets you run the deploy by hand from the Actions tab (any branch).
  workflow_dispatch:

# Never let two deploys race each other; queue instead of cancelling a live one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'gitops/image-') }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-api:prod-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-web:prod-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: GitHub no longer touches the cluster. It only records the new image
  # tag in git (as a PR). Merging that PR is the approval; Argo CD then deploys it.
  bump-image-tag:
    name: Open PR with new image tag
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      TAG: prod-${{ github.sha }}
      BRANCH: gitops/image-${{ github.run_number }}
      # A PR opened with the built-in GITHUB_TOKEN does not trigger the required CI
      # checks, so it could never be merged. This token (fine-grained, this repo
      # only: Contents + Pull requests write) makes the PR trigger CI normally.
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set new tag in kustomization.yaml
        run: |
          sed -i -E "s|(newTag: ).*|\1${TAG}|" k8s-aws/kustomization.yaml
          git diff --stat

      - name: Open pull request
        run: |
          if git diff --quiet; then
            echo "Tag is already ${TAG}, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "deploy ${TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "deploy ${TAG}" \
            --body "Sets the image tag to \`${TAG}\` (built from ${GITHUB_SHA}). Merge to let Argo CD deploy it."
