name: Deploy

on:
  push:
    branches: [main]
  # Lets you run the deploy by hand from the Actions tab (any branch).
  workflow_dispatch:

# Never let two deploys race each other; queue instead of cancelling a live one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-api:prod-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-web:prod-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kubex-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    # Add a required reviewer on this environment in repo settings
    # (Settings > Environments > production) to get the manual approval gate.
    environment: production
    env:
      IMAGE_TAG: prod-${{ github.sha }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      SSH_TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      SSH_OPTS: -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30

    steps:
      - uses: actions/checkout@v6

      # SSH on the cluster is locked to the owner's IP, so open port 22 to this
      # runner only for the length of the job (closed again in the last step).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Allow runner IP on SSH
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ vars.K3S_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      - name: Set up SSH key
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key

      # Give AWS a moment to apply the new security group rule.
      - name: Wait for SSH
        run: |
          for i in $(seq 1 12); do
            ssh $SSH_OPTS -o ConnectTimeout=10 "$SSH_TARGET" true && exit 0
            sleep 5
          done
          echo "SSH never became reachable" >&2
          exit 1

      # Everything below is idempotent (kubectl apply), so the same steps work
      # on a brand-new namespace and on later deploys.
      - name: Copy manifests to server
        run: |
          tar czf - -C k8s-aws --exclude='secret.yaml*' . \
            | ssh $SSH_OPTS "$SSH_TARGET" 'rm -rf ~/k8s-manifests && mkdir -p ~/k8s-manifests && tar xzf - -C ~/k8s-manifests'

      - name: Apply namespace, secret, config, postgres, redis
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" 'cd ~/k8s-manifests && sudo kubectl apply -f namespace.yaml'
          # secret.yaml is gitignored, so build the Secret from GitHub secrets.
          kubectl create secret generic kubex-secret -n kubex \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml \
            | ssh $SSH_OPTS "$SSH_TARGET" 'sudo kubectl apply -f -'
          ssh $SSH_OPTS "$SSH_TARGET" bash -s <<'EOF'
          set -e
          cd ~/k8s-manifests
          sudo kubectl apply -f configmap.yaml
          sudo kubectl apply -f postgres.yaml
          sudo kubectl apply -f redis.yaml
          sudo kubectl rollout status deployment/postgres -n kubex --timeout=180s
          sudo kubectl rollout status deployment/redis -n kubex --timeout=120s
          EOF

      # Migrations run before the new code starts serving traffic.
      # Jobs are immutable, so delete + recreate with this run's image tag.
      - name: Run migrate + seed job
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" 'sudo kubectl delete job migrate-seed -n kubex --ignore-not-found'
          ssh $SSH_OPTS "$SSH_TARGET" "sed 's|kubex-api:latest|kubex-api:${IMAGE_TAG}|' ~/k8s-manifests/migrate-seed-job.yaml | sudo kubectl apply -f -"
          ssh $SSH_OPTS "$SSH_TARGET" \
            'sudo kubectl wait --for=condition=complete job/migrate-seed -n kubex --timeout=180s' \
            || { ssh $SSH_OPTS "$SSH_TARGET" 'sudo kubectl logs -n kubex job/migrate-seed --tail=50'; exit 1; }

      - name: Deploy backend + frontend
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" bash -s <<EOF
          set -e
          cd ~/k8s-manifests
          sed "s|kubex-api:latest|kubex-api:${IMAGE_TAG}|" backend.yaml | sudo kubectl apply -f -
          sed "s|kubex-web:latest|kubex-web:${IMAGE_TAG}|" frontend.yaml | sudo kubectl apply -f -
          sudo kubectl apply -f ingress-frontend.yaml
          sudo kubectl apply -f ingress-backend.yaml
          sudo kubectl rollout status deployment/backend -n kubex --timeout=180s
          sudo kubectl rollout status deployment/frontend -n kubex --timeout=180s
          EOF

      - name: Show cluster state
        if: always()
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" 'sudo kubectl get pods,svc,ingress -n kubex' || true

      - name: Revoke runner IP
        if: always()
        run: |
          rm -f /tmp/deploy_key
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ vars.K3S_SECURITY_GROUP_ID }}" \
              --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"
          fi
