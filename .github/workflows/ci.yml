name: CI

on:
  pull_request:
    branches: [development, main]
  # Safety net: also test direct pushes to development, in case something
  # lands without going through a PR.
  push:
    branches: [development]

# A new push to the same PR (or branch) cancels the previous run.
# The event name keeps PR runs and push runs in separate groups.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubex
          POSTGRES_PASSWORD: kubex_password
          POSTGRES_DB: kubex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubex -d kubex_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/conftest.py expects a separate database; the service only creates kubex_db.
      # Run it inside the service container so we don't depend on psql being on the runner.
      - name: Create test database
        run: docker exec ${{ job.services.postgres.id }} psql -U kubex -d kubex_db -c "CREATE DATABASE kubex_test;"

      - name: Check migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://kubex:kubex_password@localhost:5432/kubex_db

      - name: Run tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://kubex:kubex_password@localhost:5432/kubex_test
          REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Typecheck and build
        run: npm run build

  docker:
    name: Docker (build only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
