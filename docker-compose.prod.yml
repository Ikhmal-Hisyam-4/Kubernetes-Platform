# Production compose file. Lives on the EC2 host (~/kubex/docker-compose.prod.yml).
#
# Unlike the local docker-compose.yml, this never builds — it pulls prebuilt
# images that the Deploy workflow pushed to Docker Hub.
#
# Values come from a .env file sitting next to this one on the server:
#   DOCKERHUB_USERNAME=...
#   IMAGE_TAG=prod-<sha>      # rewritten by the deploy workflow on every release
#   POSTGRES_PASSWORD=...
#   JWT_SECRET=...          # signs auth tokens — must match Settings.jwt_secret in app/core/config.py
#   FRONTEND_URL=https://your-domain

services:
  postgres:
    image: postgres:16-alpine
    container_name: kubex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kubex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kubex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports: — Postgres stays on the internal network, not exposed to the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubex -d kubex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kubex-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_USERNAME}/kubex-api:${IMAGE_TAG}
    container_name: kubex-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kubex:${POSTGRES_PASSWORD}@postgres:5432/kubex_db
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${DOCKERHUB_USERNAME}/kubex-web:${IMAGE_TAG}
    container_name: kubex-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
